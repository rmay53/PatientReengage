# Local prototype: `docker compose up --build`, then seed with
#   docker compose exec app npm run seed
# Values come from .env (copy .env.example). Defaults below are for local test use only.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reengage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reengage-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-reengage}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-reengage}:${POSTGRES_PASSWORD:-reengage-local-only}@db:5432/${POSTGRES_DB:-reengage}?schema=public
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      # Plain http on localhost: browsers drop Secure cookies there. Set to true behind HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-}
      DISPLAY_TIME_ZONE: ${DISPLAY_TIME_ZONE:-America/New_York}

volumes:
  pgdata:
